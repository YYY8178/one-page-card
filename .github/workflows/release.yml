name: Release

# 两种触发方式，都会用 CHANGELOG.md 里对应版本的段落作为发布说明：
# 1. main 分支上的 CHANGELOG.md 有更新：取最上面的版本号，若还没发布就自动打标签并发布
# 2. 手动推送 v* 标签
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/^## //')
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          awk -v t="## ${tag} " 'index($0,t)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "见 CHANGELOG.md" > notes.md
          echo "版本：${tag}"; cat notes.md
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          [ -n "$TAG" ] || { echo "CHANGELOG.md 里没找到版本号"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG 已发布，跳过"; exit 0; fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
